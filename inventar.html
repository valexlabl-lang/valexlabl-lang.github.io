<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f252e;--txt:#eef2f7;--mut:#8b96a5;--line:#273040;--acc:#f59e0b;--acc2:#f97316;--ok:#34c759;--warn:#ffb02e;--bad:#ff5a5f;--sh:0 8px 30px rgba(0,0,0,.35)}
html[data-theme=light]{--bg:#f2f4f8;--card:#fff;--card2:#eef1f6;--txt:#161b22;--mut:#667386;--line:#dde3ec;--sh:0 8px 30px rgba(30,50,90,.12)}
@media(prefers-color-scheme:light){html[data-theme=auto]{--bg:#f2f4f8;--card:#fff;--card2:#eef1f6;--txt:#161b22;--mut:#667386;--line:#dde3ec;--sh:0 8px 30px rgba(30,50,90,.12)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#app{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
.two>*,.f{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;min-height:46px;text-align:left;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(27px + env(safe-area-inset-top)) 14px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.carsel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;max-width:70%}
.carsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut)}
.pill.ok{background:rgba(52,199,89,.15);color:var(--ok)}.pill.soon{background:rgba(255,176,46,.16);color:var(--warn)}.pill.over{background:rgba(255,90,95,.16);color:var(--bad)}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero .av{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:30px;overflow:hidden;flex:none}
.hero .av img{width:100%;height:100%;object-fit:cover}
.hero .row{display:flex;gap:12px;align-items:center}
.hero h2{margin:0;font-size:20px}.hero .sub{opacity:.85;font-size:14px}
.odo{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-top:12px;display:flex;align-items:baseline;gap:8px}
.odo small{font-size:15px;font-weight:600;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.btn.sec{background:var(--card2);color:var(--txt)}.btn.red{background:rgba(255,90,95,.15);color:var(--bad)}.btn.glass{background:rgba(255,255,255,.22);color:#fff;padding:7px 12px;font-size:14px}
.btn.full{width:100%}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-size:12px;font-weight:600}
.qa i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .l{color:var(--mut);font-size:12px}.tile .v{font-size:21px;font-weight:700;margin-top:2px}.tile .s{color:var(--mut);font-size:12px}
h3{margin:18px 2px 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
h3 button{color:var(--acc);text-transform:none;letter-spacing:0;font-size:14px}
.rec{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rec:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.rec .m{flex:1;min-width:0}.rec .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec .s{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .c{font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin:8px 0}
.bar>div{height:100%;border-radius:9px;background:var(--ok)}
.bar.soon>div{background:var(--warn)}.bar.over>div{background:var(--bad)}
.mut{color:var(--mut)}.sm{font-size:13px}
.flex{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav>div{display:flex;width:100%;max-width:600px}
nav button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}
nav button{position:relative}
nav button.on{color:var(--acc);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal>span{font-size:12px;color:var(--mut);padding:2px 0}

async function lookupProduct(code) {

  if (mine) return { name: mine.name, src: "из ваших покупок" };
  if (S.catalog[code] && S.catalog[code].name) return { name: S.catalog[code].name, src: "из вашего каталога" };
  const F = "?fields=product_name,product_name_ru,generic_name,brands,quantity";
  const P = [["Open Food Facts", "https://world.openfoodfacts.org/api/v2/product/" + code + ".json" + F], ["Open Products Facts", "https://world.openproductsfacts.org/api/v2/product/" + code + ".json" + F], ["Open Beauty Facts", "https://world.openbeautyfacts.org/api/v2/product/" + code + ".json" + F]];

    return null;
  })));

  try {

 ${(it.photos || []).length ? '<div class="flex" style="flex-wrap:wrap;margin-bottom:12px">' + it.photos.map((p, i) => `<img class="thumb" src="${p}" data-view="${i}">`).join("") + "</div>" : ""}
 <div class="two" style="margin-bottom:8px"><button class="btn sec" data-a="moveOne" data-id="${it.id}">🚚 Переложил</button><button class="btn sec" data-a="shareOne" data-id="${it.id}">📤 Отправить</button></div>
 <button class="btn full" data-a="edit" data-id="${it.id}">✏️ Изменить</button>`);
  $$(".sheetov [data-view]").forEach((im) => im.onclick = () => viewPhoto(it.photos[+im.dataset.view]));
}
/* ---------- экраны ---------- */
function render() {
  applyTheme();
  const tabs = [["list", "🔎", "Вещи"], ["places", "📦", "Места"], ["more", "⚙️", "Ещё"]];
  $("#tabs").innerHTML = tabs.map((t) => `<button data-a="tab" data-v="${t[0]}" class="${ui.view === t[0] ? "on" : ""}"><i>${t[1]}</i>${t[2]}</button>`).join("");
  $("#fab").style.display = ui.view === "more" ? "none" : "grid";
  const n = S.items.length;
  $("#top").innerHTML = `<b style="font-size:19px">📦 Мои вещи</b><span class="pill">${n} ${plural(n, "вещь", "вещи", "вещей")}</span>`;
  $("#view").innerHTML = { list: listView, places: placesView, more: moreView }[ui.view]();
  if (ui.view === "list") drawList();
}
function rowHtml(it) {
  const c = CATS[it.cat] || CATS.other;
  return `<button class="rec" data-a="open" data-id="${it.id}"><div class="ic" style="background:var(--card2)">${it.photos && it.photos[0] ? `<img src="${it.photos[0]}" style="width:42px;height:42px;border-radius:13px;object-fit:cover">` : c.i}</div><div class="m"><div class="t">${esc(it.name)}${it.qty > 1 ? " ×" + it.qty : ""}</div><div class="s">📍 ${esc(placeOf(it))}</div></div></button>`;
}
function filtered() {
  const q = norm(ui.q);
  return items().filter((it) => (ui.cat === "all" || it.cat === ui.cat) && (!q || norm([it.name, it.place, it.note, it.barcode].join(" ")).indexOf(q) >= 0));
}
function drawList() {
  const el = $("#lst");
  if (!el) return;
  const l = filtered();
  el.innerHTML = l.length ? `<div class="card" style="padding:4px 14px">${l.slice(0, 200).map(rowHtml).join("")}</div>` : S.items.length ? '<div class="card empty" style="padding:22px">Ничего не найдено. Попробуйте другое слово или место.</div>' : '<div class="card empty"><b>📦</b>Пока пусто. Нажмите «+» и запишите вещь: название, где лежит, при желании фото и штрихкод. Потом найдёте её поиском за секунду.</div>';
}
function listView() {
  const tot = S.items.reduce((s, x) => s + (x.value || 0) * (x.qty || 1), 0), pc = placesList().filter((p) => p.name !== "Без места").length;
  return `<div class="tiles"><div class="tile"><div class="l">Вещей</div><div class="v">${S.items.length}</div><div class="s">мест: ${pc}</div></div><div class="tile"><div class="l">Оценка</div><div class="v">${money(tot)}</div><div class="s">по указанным ценам</div></div></div>
 <div class="flex" style="margin-bottom:10px"><input id="q" type="search" class="grow" placeholder="🔍 Где лежит… (дрель, паспорт, ёлка)" value="${esc(ui.q)}"><button class="btn sec" data-a="scanFind" aria-label="Найти по штрихкоду">▥</button></div>
 <div class="chips">${[["all", "📋", "Все"]].concat(Object.entries(CATS).map(([k, c]) => [k, c.i, c.n])).map((c) => `<button class="chip ${ui.cat === c[0] ? "on" : ""}" data-a="catf" data-v="${c[0]}">${c[1]} ${c[2]}</button>`).join("")}</div><div id="lst"></div>`;
}
function placesView() {
  const pl = placesList();
  if (!pl.length) return '<div class="card empty"><b>📦</b>Здесь появятся ваши места хранения: шкафы, коробки, гараж, дача. Добавьте первую вещь и укажите, где она лежит.</div>';
  return '<div class="sm mut" style="margin:0 2px 10px">Нажмите на место, чтобы увидеть, что там лежит. Одно и то же место лучше называть одинаково: подсказки появятся сами.</div>' + pl.map((p, i) => {
    const open = ui.open[p.name];
    return `<div class="card" style="padding:0;overflow:hidden"><button class="flex between" style="width:100%;text-align:left;padding:14px" data-a="plToggle" data-i="${i}"><b>📍 ${esc(p.name)}</b><span class="mut sm">${p.items.length} ${open ? "▴" : "▾"}</span></button>${open ? `<div style="padding:0 14px 4px;border-top:1px solid var(--line)">${p.items.map(rowHtml).join("")}</div>${p.name !== "Без места" ? `<div class="two" style="padding:8px 14px 14px"><button class="btn sec" data-a="plRename" data-i="${i}">✏️ Переименовать</button><button class="btn sec" data-a="plMove" data-i="${i}">🚚 Переложить всё</button></div>` : ""}` : ""}</div>`;
  }).join("");
}
function moreView() {
  const lb = S.settings.lastBackup;
  return `<h3>Опись для страховки и переезда</h3><div class="card"><p class="sm mut" style="margin-top:0">Список всех вещей с местом и ценой. Пригодится при переезде, ремонте, страховом случае.</p><div style="display:grid;gap:8px"><button class="btn" data-a="opisShare">📋 Отправить опись текстом</button><button class="btn sec" data-a="csv">📑 Опись в таблицу (.csv для Excel)</button></div></div>
 <h3>Данные и резервные копии</h3>
 <div class="card"><p class="sm mut" style="margin-top:0">Все вещи и фото хранятся только в памяти этого телефона. Если очистить данные Safari или удалить значок, они пропадут, поэтому периодически делайте копию. Последняя: <b>${lb ? fmtDate(lb) : "не делалась"}</b></p>
 <div style="display:grid;gap:8px"><button class="btn" data-a="exp">💾 Скачать файл-копию (.json)</button><button class="btn sec" data-a="share">📤 Отправить / сохранить в «Файлы»</button>
 <label class="btn sec">📥 Загрузить из файла<input type="file" accept=".json,application/json" hidden data-imp></label></div><div class="sm mut" id="usage" style="margin-top:10px"></div></div>
 <h3>Оформление</h3><div class="card"><div class="f" style="margin:0"><label>Тема</label><select id="th">${[["auto", "Авто"], ["dark", "Тёмная"], ["light", "Светлая"]].map((t) => `<option value="${t[0]}" ${S.settings.theme === t[0] ? "selected" : ""}>${t[1]}</option>`).join("")}</select></div></div>
 <div class="card sm mut"><b style="color:var(--txt)">📲 На экран «Домой» (iPhone):</b> откройте страницу в Safari → «Поделиться» → «На экран „Домой“».</div>
 <div class="card"><button class="btn red full" data-a="wipe">🗑️ Удалить все данные</button></div>
 <p class="mut sm" style="text-align:center">Мои вещи · данные хранятся только у вас</p>`;
}
/* ---------- опись, копия ---------- */
async function fileOut(blob, name, type, title) {
  try {
    const f = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title });
      return true;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return false;
  }
  download(blob, name);
  toast("Файл сохранён: " + name);
  return true;
}
function opisText() {
  const tot = S.items.reduce((s, x) => s + (x.value || 0) * (x.qty || 1), 0);
  return "Опись имущества на " + fmtDate(today()) + "\n" + placesList().map((p) => "\n📍 " + p.name + "\n" + p.items.map((it) => "• " + it.name + (it.qty > 1 ? " ×" + it.qty : "") + (it.value ? " — " + money(it.value * it.qty) : "")).join("\n")).join("\n") + "\n\nВсего вещей: " + S.items.length + (tot ? ", оценка " + money(tot) : "");
}
function csvOut() {
  const q = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const rows = items().map((x) => [x.name, placeOf(x), (CATS[x.cat] || CATS.other).n, x.qty, String(x.value || "").replace(".", ","), x.barcode, x.note].map(q).join(";"));
  fileOut(new Blob(["﻿" + ["Вещь", "Место", "Категория", "Кол-во", "Цена", "Штрихкод", "Заметки"].map(q).join(";") + "\r\n" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }), "opis-" + today() + ".csv", "text/csv", "Опись");
}
async function exportJSON(shr) {
  const name = "inventar-" + today() + ".json", blob = new Blob([JSON.stringify(S)], { type: "application/json" });
  if (shr) {
    if (!await fileOut(blob, name, "application/json", "Мои вещи, копия")) return;
  } else download(blob, name);
  S.settings.lastBackup = today();
  save();
  render();
  toast("Копия сохранена ✓");
}
function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let d = null;
    try {
      d = JSON.parse(rd.result);
    } catch (e) {
    }
    if (!d || !Array.isArray(d.items)) return toast("Это не файл копии «Мои вещи»");
    const o = sheet("Загрузка из файла", `<p class="sm">В файле вещей: <b>${d.items.length}</b>. Сейчас в приложении: <b>${S.items.length}</b>.</p><div style="display:grid;gap:8px"><button class="btn" id="im1">➕ Добавить к текущим</button><button class="btn red" id="im2">♻️ Заменить всё содержимым файла</button></div>`);
    $("#im1", o).onclick = () => {
      const have = new Set(S.items.map((x) => x.id));
      d.items.forEach((x) => {
        if (!have.has(x.id)) S.items.push(x);
      });
      Object.assign(S.catalog, d.catalog || {});
      save();
      closeSheet();
      render();
      toast("Импортировано ✓");
    };
    $("#im2", o).onclick = () => {
      if (!confirm("Заменить все данные? Текущие будут стёрты.")) return;
      S = Object.assign(blank(), d);
      S.settings = Object.assign(blank().settings, d.settings || {});
      S.catalog = S.catalog || {};
      save();
      closeSheet();
      render();
      toast("Данные заменены ✓");
    };
  };
  rd.readAsText(file);
}
/* ---------- действия ---------- */
const A = {
  close: closeSheet,
  tab: (d) => {
    ui.view = d.v;
    closeSheet();
    render();
    scrollTo(0, 0);
  },
  add: () => itemForm(null),
  open: (d) => {
    closeSheet();
    itemDetail(d.id);
  },
  edit: (d) => itemForm(d.id),
  catf: (d) => {
    ui.cat = d.v;
    render();
  },
  plToggle: (d) => {
    const p = placesList()[+d.i];
    if (p) ui.open[p.name] = !ui.open[p.name];
    render();
  },
  plRename: (d) => {
    const p = placesList()[+d.i];
    if (p) moveSheet("Переименовать место", p.name, (v) => {
      if (!v) return;
      p.items.forEach((it) => {
        it.place = v;
      });
      ui.open[v] = true;
      save();
      render();
      toast("Переименовано ✓");
    });
  },
  plMove: (d) => {
    const p = placesList()[+d.i];
    if (p) moveSheet("Переложить всё «" + p.name + "»", "", (v) => {
      if (!v) return;
      p.items.forEach((it) => {
        it.hist = (it.hist || []).concat([{ d: today(), place: it.place }]).slice(-10);
        it.place = v;
      });
      ui.open[v] = true;
      save();
      render();
      toast("Перемещено: " + p.items.length + " → " + v);
    });
  },
  moveOne: (d) => {
    const it = S.items.find((x) => x.id === d.id);
    if (it) moveSheet("Куда переложили?", it.place || "", (v) => {
      if (v === (it.place || "")) return;
      it.hist = (it.hist || []).concat([{ d: today(), place: it.place || "Без места" }]).slice(-10);
      it.place = v;
      save();
      render();
      toast("📍 " + (v || "Без места"));
    });
  },
  shareOne: (d) => {
    const it = S.items.find((x) => x.id === d.id);
    if (it) shareText(it.name + (it.qty > 1 ? " ×" + it.qty : "") + "\n📍 " + placeOf(it) + (it.value ? "\nЦена: " + money(it.value) : "") + (it.note ? "\n" + it.note : ""), it.name);
  },
  scanFind: () => openScanner((res) => {
    if (res.kind !== "barcode") return toast("Нужен штрихкод товара");
    const hit = S.items.filter((x) => x.barcode === res.code);
    if (hit.length === 1) return itemDetail(hit[0].id);
    if (hit.length > 1) {
      ui.q = res.code;
      ui.view = "list";
      render();
      return toast("Найдено вещей: " + hit.length);
    }
    toast("Такой вещи ещё нет, добавляю");
    itemForm(null, { barcode: res.code });
    setTimeout(() => {
      const b = $("#bFind");
      if (b) b.click();
    }, 200);
  }),
  opisShare: () => shareText(opisText(), "Опись имущества"),
  csv: csvOut,
  exp: () => exportJSON(false),
  share: () => exportJSON(true),
  wipe: () => {
    if (confirm("Удалить ВСЕ данные без возможности восстановления?") && confirm("Точно удалить? Сначала лучше сделать копию.")) {
      S = blank();
      save();
      render();
      toast("Данные удалены");
    }
  }
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (f) {
    e.preventDefault();
    f(el.dataset, el);
  }
});
document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "q") {
    ui.q = e.target.value;
    drawList();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches && t.matches("[data-imp]") && t.files[0]) {
    importFile(t.files[0]);
    t.value = "";
  }
  if (t.id === "th") {
    S.settings.theme = t.value;
    save();
    render();
  }
});
(async () => {
  try {
    try {
      await load();
    } catch (e) {
    }
    S.catalog = S.catalog || {};
    applyTheme();
    render();
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then((e) => {
        const el = $("#usage");
        if (el) el.textContent = "Занято в хранилище: " + nf2.format((e.usage || 0) / 1048576) + " МБ";
      });
    }
    window.__ready = 1;
  } catch (e) {
    window.__show && window.__show("Старт: " + (e && e.stack || e));
  }
})();

</script>
</body>
</html>
