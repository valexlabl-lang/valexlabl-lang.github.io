<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f252e;--txt:#eef2f7;--mut:#8b96a5;--line:#273040;--acc:#6366f1;--acc2:#a855f7;--ok:#34c759;--warn:#ffb02e;--bad:#ff5a5f;--sh:0 8px 30px rgba(0,0,0,.35)}
html[data-theme=light]{--bg:#f2f4f8;--card:#fff;--card2:#eef1f6;--txt:#161b22;--mut:#667386;--line:#dde3ec;--sh:0 8px 30px rgba(30,50,90,.12)}
@media(prefers-color-scheme:light){html[data-theme=auto]{--bg:#f2f4f8;--card:#fff;--card2:#eef1f6;--txt:#161b22;--mut:#667386;--line:#dde3ec;--sh:0 8px 30px rgba(30,50,90,.12)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#app{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
.two>*,.f{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;min-height:46px;text-align:left;display:block}
input[type=date]::-webkit-date-and-time-value{text-align:left}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(27px + env(safe-area-inset-top)) 14px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.carsel{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;max-width:70%}
.carsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mut)}
.pill.ok{background:rgba(52,199,89,.15);color:var(--ok)}.pill.soon{background:rgba(255,176,46,.16);color:var(--warn)}.pill.over{background:rgba(255,90,95,.16);color:var(--bad)}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero .av{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:30px;overflow:hidden;flex:none}
.hero .av img{width:100%;height:100%;object-fit:cover}
.hero .row{display:flex;gap:12px;align-items:center}
.hero h2{margin:0;font-size:20px}.hero .sub{opacity:.85;font-size:14px}
.odo{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-top:12px;display:flex;align-items:baseline;gap:8px}
.odo small{font-size:15px;font-weight:600;opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.btn.sec{background:var(--card2);color:var(--txt)}.btn.red{background:rgba(255,90,95,.15);color:var(--bad)}.btn.glass{background:rgba(255,255,255,.22);color:#fff;padding:7px 12px;font-size:14px}
.btn.full{width:100%}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-size:12px;font-weight:600}
.qa i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile .l{color:var(--mut);font-size:12px}.tile .v{font-size:21px;font-weight:700;margin-top:2px}.tile .s{color:var(--mut);font-size:12px}
h3{margin:18px 2px 8px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
h3 button{color:var(--acc);text-transform:none;letter-spacing:0;font-size:14px}
.rec{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rec:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.rec .m{flex:1;min-width:0}.rec .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec .s{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .c{font-weight:700;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chip{padding:8px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin:8px 0}
.bar>div{height:100%;border-radius:9px;background:var(--ok)}
.bar.soon>div{background:var(--warn)}.bar.over>div{background:var(--bad)}
.mut{color:var(--mut)}.sm{font-size:13px}
.flex{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav>div{display:flex;width:100%;max-width:600px}
nav button{flex:1;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}
nav button{position:relative}
nav button.on{color:var(--acc);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal>span{font-size:12px;color:var(--mut);padding:2px 0}
.cd{position:relative;height:42px;border-radius:12px;font-size:15px;font-weight:500;display:grid;place-items:center;background:var(--card2)}
.cd i{position:absolute;bottom:5px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%}
.cd.tod{box-shadow:inset 0 0 0 2px var(--acc)}
.cd.sel{background:var(--acc);color:#fff}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 0 8px}
.bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-style:normal;line-height:1}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:32px;box-shadow:var(--sh);z-index:25;display:grid;place-items:center;line-height:1}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:.6}}
.sh{background:var(--bg);width:100%;max-width:600px;max-height:calc(100vh - env(safe-area-inset-top,0px) - 72px);max-height:calc(100dvh - env(safe-area-inset-top,0px) - 72px);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:su .2s}
.shh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 10px;font-size:18px}
.x{width:40px;height:40px;border-radius:50%;background:var(--card2);color:var(--txt);font-size:18px;flex:none}
.shb{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cats button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 4px;font-size:12px;font-weight:600;text-align:center}
.cats button i{display:block;font-style:normal;font-size:22px}
.cats button.on{border-color:var(--acc);background:var(--card2);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.sw{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card2);border-radius:12px;border:1px solid var(--line)}
.sw input{width:22px;height:22px;flex:none}

  save();
  const tot = sl.reduce((s, x) => s + x.s.sum, 0);
  sheet("🔁 Скоро спишется", sl.map((x) => `<button class="kv" style="width:100%;text-align:left" data-a="subOpen" data-id="${x.s.id}"><span>${esc(x.s.name)}</span><span class="sm">${whenText(x.left)} · ${money(x.s.sum)}</span></button>`).join("") + `<div class="sm mut" style="margin:10px 0">Всего: ${money(tot)}. Проверьте, что на карте достаточно денег.</div><button class="btn sec full" data-a="close">Понятно</button>`);
}
/* ---------- календарь, CSV, копия ---------- */
function icsAll() {
  const list = activeSubs();
  if (!list.length) return toast("Нет подписок для календаря");
  const e2 = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  const ymd = (x) => x.replace(/-/g, ""), stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const RR = { w: "FREQ=WEEKLY", m: "FREQ=MONTHLY", q: "FREQ=MONTHLY;INTERVAL=3", y: "FREQ=YEARLY" };
  const ev = list.map((s) => {
    const title = "🔁 Спишется " + money(s.sum) + ": " + s.name;
    return ["BEGIN:VEVENT", "UID:tr-" + s.id + "@trati", "DTSTAMP:" + stamp, "DTSTART;VALUE=DATE:" + ymd(s.next), "DTEND;VALUE=DATE:" + ymd(iso(new Date(D(s.next).getTime() + 864e5))), "RRULE:" + RR[s.per], "SUMMARY:" + e2(title), "DESCRIPTION:" + e2(s.note || "Регулярное списание"), "TRANSP:TRANSPARENT"].concat(["-PT9H", "PT9H"].map((t) => "BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:" + e2(title) + "\r\nTRIGGER:" + t + "\r\nEND:VALARM"), ["END:VEVENT"]).join("\r\n");
  });
  const text = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//trati//RU", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Подписки"].concat(ev, ["END:VCALENDAR"]).join("\r\n") + "\r\n";
  return fileOut(new Blob([text], { type: "text/calendar;charset=utf-8" }), "podpiski.ics", "text/calendar", "Подписки");
}
async function fileOut(blob, name, type, title) {
  try {
    const f = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title });
      return true;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return false;
  }
  download(blob, name);
  toast("Файл сохранён: " + name);
  return true;
}
function csvOut() {
  const q = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const rows = S.exp.slice().sort((a, b) => a.date.localeCompare(b.date)).map((x) => [fmtDate(x.date), String(x.sum).replace(".", ","), CATS[x.cat] ? CATS[x.cat].n : x.cat, x.note || ""].map(q).join(";"));
  fileOut(new Blob(["\ufeff" + ["Дата", "Сумма", "Категория", "Заметка"].map(q).join(";") + "\r\n" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }), "trati-" + today() + ".csv", "text/csv", "Траты");
}
async function exportJSON(shr) {
  const name = "trati-" + today() + ".json", blob = new Blob([JSON.stringify(S)], { type: "application/json" });
  if (shr) {
    if (!await fileOut(blob, name, "application/json", "Траты и подписки, копия")) return;
  } else download(blob, name);
  S.settings.lastBackup = today();
  save();
  render();
  toast("Копия сохранена ✓");
}
function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let d = null;
    try {
      d = JSON.parse(rd.result);
    } catch (e) {
    }
    if (!d || !Array.isArray(d.exp)) return toast("Это не файл копии «Траты и подписки»");
    const o = sheet("Загрузка из файла", `<p class="sm">В файле трат: <b>${d.exp.length}</b>, подписок: <b>${(d.subs || []).length}</b>. Сейчас в приложении: <b>${S.exp.length}</b> и <b>${S.subs.length}</b>.</p><div style="display:grid;gap:8px"><button class="btn" id="im1">➕ Добавить к текущим</button><button class="btn red" id="im2">♻️ Заменить всё содержимым файла</button></div>`);
    $("#im1", o).onclick = () => {
      const he = new Set(S.exp.map((x) => x.id)), hs = new Set(S.subs.map((x) => x.id));
      d.exp.forEach((x) => {
        if (!he.has(x.id)) S.exp.push(x);
      });
      (d.subs || []).forEach((x) => {
        if (!hs.has(x.id)) S.subs.push(x);
      });
      save();
      closeSheet();
      render();
      toast("Импортировано ✓");
    };
    $("#im2", o).onclick = () => {
      if (!confirm("Заменить все данные? Текущие будут стёрты.")) return;
      S = Object.assign(blank(), d);
      S.settings = Object.assign(blank().settings, d.settings || {});
      save();
      closeSheet();
      render();
      toast("Данные заменены ✓");
    };
  };
  rd.readAsText(file);
}
/* ---------- действия ---------- */
const A = {
  close: closeSheet,
  tab: (d) => {
    ui.view = d.v;
    closeSheet();
    render();
    scrollTo(0, 0);
  },
  add: () => ui.view === "subs" ? subForm(null) : expForm(null),
  openExp: (d) => expForm(d.id),
  subOpen: (d) => {
    closeSheet();
    subForm(d.id);
  },
  ymPrev: () => {
    ui.ym = ymAdd(ui.ym, -1);
    render();
  },
  ymNext: () => {
    if (ui.ym < ymOf(today())) {
      ui.ym = ymAdd(ui.ym, 1);
      render();
    }
  },
  catf: (d) => {
    ui.cat = d.v;
    render();
  },
  oldToggle: () => {
    ui.oldOpen = !ui.oldOpen;
    render();
  },
  icsAll,
  csv: csvOut,
  badgeOn: async () => {
    try {
      if (Notification.permission !== "granted") {
        const p = await Notification.requestPermission();
        if (p !== "granted") return toast("Разрешение не выдано. Включить: Настройки iPhone, Уведомления");
      }
      setBadge(soonSubs(3).length);
      render();
      toast("Значок включён ✓");
    } catch (e) {
      toast("Не получилось включить значок");
    }
  },
  exp: () => exportJSON(false),
  share: () => exportJSON(true),
  wipe: () => {
    if (confirm("Удалить ВСЕ данные без возможности восстановления?") && confirm("Точно удалить? Сначала лучше сделать копию.")) {
      S = blank();
      save();
      render();
      toast("Данные удалены");
    }
  }
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (f) {
    e.preventDefault();
    f(el.dataset, el);
  }
});
document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "q") {
    ui.q = e.target.value;
    drawList();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches && t.matches("[data-imp]") && t.files[0]) {
    importFile(t.files[0]);
    t.value = "";
  }
  if (t.id === "th") {
    S.settings.theme = t.value;
    save();
    render();
  }
  if (t.id === "alPop") {
    S.settings.alertPopup = t.checked;
    save();
  }
  if (t.id === "autoSub") {
    S.settings.autoSub = t.checked;
    save();
  }
  if (t.id === "bud") {
    S.settings.budget = pn(t.value) || 0;
    save();
    toast("Лимит сохранён ✓");
  }
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && rollSubs()) render();
});
(async () => {
  try {
    try {
      await load();
    } catch (e) {
    }
    applyTheme();
    rollSubs();
    render();
    setTimeout(dailyAlert, 700);
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then((e) => {
        const el = $("#usage");
        if (el) el.textContent = "Занято в хранилище: " + nf2.format((e.usage || 0) / 1048576) + " МБ";
      });
    }
    window.__ready = 1;
  } catch (e) {
    window.__show && window.__show("Старт: " + (e && e.stack || e));
  }
})();

</script>
</body>
