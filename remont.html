function csvOut() {
  const q = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const rows = S.exp.slice().sort((a, b) => a.date.localeCompare(b.date)).map((x) => [fmtDate(x.date), x.name, (KINDS[x.kind] || KINDS.other).n, stageName(x.stage), x.room ? roomName(x.room) : "", x.who, x.qty, x.unit, String(x.price || "").replace(".", ","), String(x.sum).replace(".", ","), x.paid === false ? "не оплачено" : "оплачено", x.barcode, x.note].map(q).join(";"));
  fileOut(new Blob(["﻿" + ["Дата", "Что", "Тип", "Этап", "Комната", "Кому", "Кол-во", "Ед.", "Цена", "Сумма", "Оплата", "Штрихкод", "Заметка"].map(q).join(";") + "\r\n" + rows.join("\r\n")], { type: "text/csv;charset=utf-8" }), "remont-" + today() + ".csv", "text/csv", "Расходы на ремонт");
}
function reportHtml() {
  const P = S.project || {}, paid = sumOf(paidExp()), due = sumOf(dueExp()), plan = S.plan.reduce((s, p) => s + planSum(p), 0);
  const e = esc, rowsS = S.stages.map((s) => ({ n: s.name, f: sumOf(S.exp.filter((x) => x.stage === s.id)), p: S.plan.filter((x) => x.stage === s.id).reduce((a, x) => a + planSum(x), 0) })).filter((x) => x.f || x.p);
  const exps = S.exp.slice().sort((a, b) => a.date.localeCompare(b.date));
  const roomsWith = S.rooms.concat([{ id: "", name: "Без комнаты" }]).filter((r) => S.photos.some((p) => (p.room || "") === r.id));
  return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчёт о ремонте</title><style>body{font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;color:#111;max-width:820px;margin:0 auto;padding:20px}h1{margin:0 0 4px}h2{margin:28px 0 8px;border-bottom:2px solid #eee;padding-bottom:4px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #e5e5e5;padding:6px 4px;text-align:left}td.n,th.n{text-align:right;white-space:nowrap}.k{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k div{background:#f4f6f8;border-radius:10px;padding:10px}.k b{display:block;font-size:20px}.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}.ph small{display:block;color:#666;font-size:11px}@media print{h2{break-after:avoid}.ph{break-inside:avoid}}</style></head><body>
<h1>Отчёт о ремонте</h1><div style="color:#666">${e(P.name || "")} · ${fmtDate(today())}${P.area ? " · " + P.area + " м²" : ""}${P.start ? " · с " + fmtDate(P.start) : ""}</div>
<h2>Итоги</h2><div class="k"><div>Оплачено<b>${money(paid)}</b></div><div>К оплате<b>${money(due)}</b></div><div>Бюджет<b>${P.budget ? money(P.budget) : "—"}</b></div><div>Смета<b>${plan ? money(plan) : "—"}</b></div></div>
${rowsS.length ? `<h2>По этапам</h2><table><tr><th>Этап</th><th class="n">План</th><th class="n">Факт</th><th class="n">Разница</th></tr>${rowsS.map((x) => `<tr><td>${e(x.n)}</td><td class="n">${x.p ? money(x.p) : "—"}</td><td class="n">${money(x.f)}</td><td class="n">${x.p ? (x.f - x.p > 0 ? "+" : "") + money(x.f - x.p) : ""}</td></tr>`).join("")}</table>` : ""}
<h2>Расходы (${exps.length})</h2><table><tr><th>Дата</th><th>Что</th><th>Кому</th><th>Этап</th><th class="n">Сумма</th></tr>${exps.map((x) => `<tr><td>${fmtDate(x.date)}</td><td>${e(x.name)}</td><td>${e(x.who || "")}</td><td>${e(stageName(x.stage) === "Без этапа" ? "" : stageName(x.stage))}</td><td class="n">${money(x.sum)}${x.paid === false ? " (не оплачено)" : ""}</td></tr>`).join("")}</table>
${roomsWith.length ? "<h2>Фото</h2>" + roomsWith.map((r) => `<h3 style="margin:14px 0 6px">${e(r.name)}</h3><div class="ph">${S.photos.filter((p) => (p.room || "") === r.id).sort((a, b) => a.createdAt - b.createdAt).map((p) => `<div><img src="${p.img}"><small>${PHK[p.kind]} · ${fmtDate(p.date)}${p.note ? " · " + e(p.note) : ""}</small></div>`).join("")}</div>`).join("") : ""}
</body></html>`;
}
async function exportJSON(shr) {
  const name = "remont-" + today() + ".json", blob = new Blob([JSON.stringify(S)], { type: "application/json" });
  if (shr) { if (!await fileOut(blob, name, "application/json", "Ремонт, копия")) return; } else download(blob, name);
  S.settings.lastBackup = today();
  save(); render(); toast("Копия сохранена ✓");
}
function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let d = null;
    try { d = JSON.parse(rd.result); } catch (e) { }
    if (!d || !Array.isArray(d.exp)) return toast("Это не файл копии «Ремонт»");
    const o = sheet("Загрузка из файла", `<p class="sm">В файле расходов: <b>${d.exp.length}</b>, фото: <b>${(d.photos || []).length}</b>. Сейчас в приложении: <b>${S.exp.length}</b> и <b>${S.photos.length}</b>.</p><div style="display:grid;gap:8px"><button class="btn red" id="im2">♻️ Заменить всё содержимым файла</button></div><p class="sm mut">Объединять копии не получится, потому что этапы и комнаты связаны с записями. Загрузка заменяет текущие данные.</p>`);
    $("#im2", o).onclick = () => {
      if (!confirm("Заменить все данные? Текущие будут стёрты.")) return;
      S = Object.assign(blank(), d);
      S.settings = Object.assign(blank().settings, d.settings || {});
      S.catalog = S.catalog || {};
      save(); closeSheet(); render(); toast("Данные заменены ✓");
    };
  };
  rd.readAsText(file);
}
/* ---------- действия ---------- */
const A = {
  close: closeSheet,
  tab: (d) => { ui.view = d.v; closeSheet(); render(); scrollTo(0, 0); },
  add: (d) => {
    if (!S.project) return projectForm();
    if (ui.view === "plan") return planForm(null);
    if (ui.view === "photos") return photoAdd();
    if (ui.view === "rooms") return roomEditor(null);
    expForm(null);
    if (d.m) setTimeout(() => { const b = $(d.m === "voice" ? "#exV" : d.m === "qr" ? "#exQ" : "#exB"); if (b) b.click(); }, 150);
  },
  addPlan: () => planForm(null),
  roomAdd: () => roomEditor(null),
  roomEdit: (d) => roomEditor(d.id),
  ruler: () => openRuler(null),
  openExp: (d) => { closeSheet(); expForm(d.id); },
  openPlan: (d) => planForm(d.id),
  project: projectForm,
  edStages: () => listEditor("Этапы ремонта", "stages"),
  edRooms: () => listEditor("Комнаты", "rooms"),
  photoAdd: (d) => photoAdd(d.kind ? { kind: d.kind } : null),
  photoOpen: (d) => photoOpen(d.id),
  compare: (d) => compareSheet(d.r === "none" ? "" : d.r),
  pRoom: (d) => { ui.pRoom = d.v === "none" ? "" : d.v; render(); },
  pKind: (d) => { ui.pKind = d.v; render(); },
  kindf: (d) => { ui.kind = d.v; render(); },
  markPaid: (d) => { const x = S.exp.find((y) => y.id === d.id); if (x) { x.paid = true; x.due = ""; x.date = today(); save(); render(); toast("Отмечено как оплаченное ✓"); } },
  report: () => fileOut(new Blob([reportHtml()], { type: "text/html;charset=utf-8" }), "remont-otchet-" + today() + ".html", "text/html", "Отчёт о ремонте"),
  sumShare: () => shareText(summaryText(), "Итоги ремонта"),
  csv: csvOut,
  exp: () => exportJSON(false),
  share: () => exportJSON(true),
  wipe: () => {
    if (confirm("Удалить ВСЕ данные без возможности восстановления?") && confirm("Точно удалить? Сначала лучше сделать копию.")) { S = blank(); save(); render(); toast("Данные удалены"); }
  }
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener("input", (e) => { if (e.target && e.target.id === "q") { ui.q = e.target.value; drawExp(); } });
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches && t.matches("[data-imp]") && t.files[0]) { importFile(t.files[0]); t.value = ""; }
  if (t.id === "th") { S.settings.theme = t.value; save(); render(); }
  if (t.id === "alPop") { S.settings.alertPopup = t.checked; save(); }
  if (t.id === "fSt") { ui.stage = t.value; render(); }
  if (t.id === "fRm") { ui.room = t.value; render(); }
});
(async () => {
  try {
    try { await load(); } catch (e) { }
    S.catalog = S.catalog || {};
    ["rooms", "stages", "plan", "exp", "photos"].forEach((k) => { S[k] = S[k] || []; });
    applyTheme();
    render();
    setTimeout(dailyAlert, 700);
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then((e) => { const el = $("#usage"); if (el) el.textContent = "Занято в хранилище: " + nf2.format((e.usage || 0) / 1048576) + " МБ"; });
    }
    window.__ready = 1;
  } catch (e) {
    window.__show && window.__show("Старт: " + (e && e.stack || e));
  }
})();

</script>
</body>
